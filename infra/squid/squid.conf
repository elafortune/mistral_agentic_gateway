# Liste blanche d'egress pour agent_net (Étape 4). Seuls les domaines des API
# LLM utilisées par le projet sont autorisés ; tout le reste est refusé (403).
# http_access est évalué dans l'ordre -- la première règle qui matche gagne.

acl allowed_llm_apis dstdomain .mistral.ai
acl allowed_llm_apis dstdomain .googleapis.com

acl SSL_ports port 443
acl CONNECT method CONNECT

http_access allow allowed_llm_apis
http_access deny all

http_port 3128
coredump_dir /var/spool/squid
